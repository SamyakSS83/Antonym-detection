<svg viewBox="0 0 900 660" xmlns="http://www.w3.org/2000/svg">
  <!-- Background and Title -->
  <rect width="900" height="660" fill="#f8f9fa" rx="10" ry="10"/>
  <text x="450" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold" fill="#333">Word Pair Antonym Detection Pipeline</text>
  
  <!-- BERT Embedding Section -->
  <rect x="50" y="80" width="800" height="180" fill="#e3f2fd" stroke="#64b5f6" stroke-width="2" rx="10" ry="10"/>
  <text x="450" y="100" font-family="Arial" font-size="18" text-anchor="middle" fill="#1565c0" font-weight="bold">1. BERT Embedding Generation</text>
  
  <!-- Input Words and BERT Model -->
  <rect x="80" y="120" width="120" height="80" fill="#bbdefb" stroke="#2196f3" stroke-width="2" rx="5" ry="5"/>
  <text x="140" y="145" font-family="Arial" font-size="14" text-anchor="middle">Word 1</text>
  <text x="140" y="165" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">"hot"</text>
  
  <rect x="80" y="210" width="120" height="30" fill="#bbdefb" stroke="#2196f3" stroke-width="2" rx="5" ry="5"/>
  <text x="140" y="230" font-family="Arial" font-size="14" text-anchor="middle">Tokenizer</text>
  
  <rect x="240" y="120" width="120" height="80" fill="#bbdefb" stroke="#2196f3" stroke-width="2" rx="5" ry="5"/>
  <text x="300" y="145" font-family="Arial" font-size="14" text-anchor="middle">Word 2</text>
  <text x="300" y="165" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">"cold"</text>
  
  <rect x="240" y="210" width="120" height="30" fill="#bbdefb" stroke="#2196f3" stroke-width="2" rx="5" ry="5"/>
  <text x="300" y="230" font-family="Arial" font-size="14" text-anchor="middle">Tokenizer</text>
  
  <rect x="400" y="120" width="180" height="120" fill="#90caf9" stroke="#1976d2" stroke-width="2" rx="5" ry="5"/>
  <text x="490" y="145" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Fine-tuned BERT</text>
  <text x="490" y="170" font-family="Arial" font-size="12" text-anchor="middle">Extract CLS token</text>
  <text x="490" y="190" font-family="Arial" font-size="12" text-anchor="middle">embeddings (768-dim)</text>
  <text x="490" y="210" font-family="Arial" font-size="12" text-anchor="middle">from last hidden state</text>
  
  <rect x="620" y="120" width="180" height="120" fill="#bbdefb" stroke="#2196f3" stroke-width="2" rx="5" ry="5"/>
  <text x="710" y="145" font-family="Arial" font-size="14" text-anchor="middle">Word Embeddings</text>
  <rect x="640" y="160" width="140" height="30" fill="#e1f5fe" stroke="#81d4fa" stroke-width="1" rx="3" ry="3"/>
  <text x="710" y="180" font-family="Arial" font-size="12" text-anchor="middle">hot: [0.2, -0.1, ...]</text>
  <rect x="640" y="200" width="140" height="30" fill="#e1f5fe" stroke="#81d4fa" stroke-width="1" rx="3" ry="3"/>
  <text x="710" y="220" font-family="Arial" font-size="12" text-anchor="middle">cold: [-0.3, 0.4, ...]</text>
  
  <!-- Arrows -->
  <line x1="140" y1="200" x2="140" y2="210" stroke="#1976d2" stroke-width="2"/>
  <line x1="300" y1="200" x2="300" y2="210" stroke="#1976d2" stroke-width="2"/>
  <line x1="200" y1="220" x2="240" y2="220" stroke="#1976d2" stroke-width="2"/>
  <polygon points="240,220 234,216 234,224" fill="#1976d2"/>
  <line x1="360" y1="180" x2="400" y2="180" stroke="#1976d2" stroke-width="2"/>
  <polygon points="400,180 394,176 394,184" fill="#1976d2"/>
  <line x1="580" y1="180" x2="620" y2="180" stroke="#1976d2" stroke-width="2"/>
  <polygon points="620,180 614,176 614,184" fill="#1976d2"/>
  
  <!-- Graph Construction Section -->
  <rect x="50" y="280" width="800" height="180" fill="#e8f5e9" stroke="#81c784" stroke-width="2" rx="10" ry="10"/>
  <text x="450" y="300" font-family="Arial" font-size="18" text-anchor="middle" fill="#2e7d32" font-weight="bold">2. Graph Construction</text>
  
  <!-- Graph Construction Process -->
  <rect x="100" y="330" width="280" height="110" fill="#c8e6c9" stroke="#4caf50" stroke-width="2" rx="5" ry="5"/>
  <text x="240" y="350" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">WordPairGraphDataset</text>
  <text x="240" y="370" font-family="Arial" font-size="12" text-anchor="middle">For each word pair:</text>
  <text x="240" y="390" font-family="Arial" font-size="12" text-anchor="middle">- Create nodes with BERT embeddings</text>
  <text x="240" y="410" font-family="Arial" font-size="12" text-anchor="middle">- Add bidirectional edges</text>
  <text x="240" y="430" font-family="Arial" font-size="12" text-anchor="middle">- Assign class label (0: synonym, 1: antonym)</text>
  
  <!-- Graph Visualization -->
  <rect x="520" y="330" width="280" height="110" fill="#c8e6c9" stroke="#4caf50" stroke-width="2" rx="5" ry="5"/>
  
  <!-- Graph Nodes -->
  <circle cx="590" cy="370" r="25" fill="#a5d6a7" stroke="#388e3c" stroke-width="2"/>
  <text x="590" y="375" font-family="Arial" font-size="12" text-anchor="middle">"hot"</text>
  
  <circle cx="730" cy="370" r="25" fill="#a5d6a7" stroke="#388e3c" stroke-width="2"/>
  <text x="730" y="375" font-family="Arial" font-size="12" text-anchor="middle">"cold"</text>
  
  <!-- Graph Edges -->
  <line x1="611" y1="359" x2="709" y2="359" stroke="#388e3c" stroke-width="2"/>
  <polygon points="709,359 703,355 703,363" fill="#388e3c"/>
  
  <line x1="709" y1="381" x2="611" y2="381" stroke="#388e3c" stroke-width="2"/>
  <polygon points="611,381 617,377 617,385" fill="#388e3c"/>
  
  <text x="660" y="350" font-family="Arial" font-size="10" text-anchor="middle">edge</text>
  <text x="660" y="395" font-family="Arial" font-size="10" text-anchor="middle">edge</text>
  
  <text x="660" y="425" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Label: Antonym (1)</text>
  
  <!-- Arrow -->
  <line x1="380" y1="385" x2="520" y2="385" stroke="#2e7d32" stroke-width="2"/>
  <polygon points="520,385 514,381 514,389" fill="#2e7d32"/>
  
  <!-- Model Training Section -->
  <rect x="50" y="480" width="800" height="160" fill="#fff3e0" stroke="#ffb74d" stroke-width="2" rx="10" ry="10"/>
  <text x="450" y="500" font-family="Arial" font-size="18" text-anchor="middle" fill="#e65100" font-weight="bold">3. Hierarchical GAT with Contrastive Learning</text>
  
  <!-- Model Architecture -->
  <rect x="80" y="520" width="330" height="100" fill="#ffe0b2" stroke="#ff9800" stroke-width="2" rx="5" ry="5"/>
  <text x="245" y="535" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">HierarchicalGATWithContrastive</text>
  
  <!-- Model Components -->
  <rect x="90" y="545" width="95" height="30" fill="#fff8e1" stroke="#ffc107" stroke-width="1" rx="3" ry="3"/>
  <text x="137" y="565" font-family="Arial" font-size="11" text-anchor="middle">GAT Layers</text>
  
  <rect x="195" y="545" width="95" height="30" fill="#fff8e1" stroke="#ffc107" stroke-width="1" rx="3" ry="3"/>
  <text x="242" y="565" font-family="Arial" font-size="11" text-anchor="middle">Pooling</text>
  
  <rect x="300" y="545" width="95" height="30" fill="#fff8e1" stroke="#ffc107" stroke-width="1" rx="3" ry="3"/>
  <text x="347" y="565" font-family="Arial" font-size="11" text-anchor="middle">Attention</text>
  
  <rect x="90" y="580" width="95" height="30" fill="#fff8e1" stroke="#ffc107" stroke-width="1" rx="3" ry="3"/>
  <text x="137" y="600" font-family="Arial" font-size="11" text-anchor="middle">Classification</text>
  
  <rect x="195" y="580" width="95" height="30" fill="#fff8e1" stroke="#ffc107" stroke-width="1" rx="3" ry="3"/>
  <text x="242" y="600" font-family="Arial" font-size="11" text-anchor="middle">Contrastive</text>
  
  <rect x="300" y="580" width="95" height="30" fill="#fff8e1" stroke="#ffc107" stroke-width="1" rx="3" ry="3"/>
  <text x="347" y="600" font-family="Arial" font-size="11" text-anchor="middle">Relation Loss</text>
  
  <!-- Loss Function Visualization -->
  <rect x="440" y="520" width="330" height="100" fill="#ffe0b2" stroke="#ff9800" stroke-width="2" rx="5" ry="5"/>
  <text x="605" y="540" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Training Loss Components</text>
  
  <rect x="450" y="550" width="310" height="60" fill="#fff8e1" stroke="#ffc107" stroke-width="1" rx="3" ry="3"/>
  <text x="605" y="570" font-family="Arial" font-size="12" text-anchor="middle">Loss = CE Loss + λ₁·Contrastive Loss + λ₂·Relation Loss</text>
  <text x="605" y="590" font-family="Arial" font-size="11" text-anchor="middle">• CE Loss: Standard cross-entropy for classification</text>
  <text x="605" y="605" font-family="Arial" font-size="11" text-anchor="middle">• Contrastive Loss: Push similar pairs together, dissimilar apart</text>
</svg>