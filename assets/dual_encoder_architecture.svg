<svg viewBox="0 0 900 550" xmlns="http://www.w3.org/2000/svg">
  <!-- Background and Title -->
  <rect width="900" height="600" fill="#f8f9fa" rx="10" ry="10"/>
  <text x="450" y="30" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold" fill="#333">DualEncoderGraphTransformer Architecture</text>
  
  <!-- Dual Encoder Section -->
  <rect x="50" y="70" width="800" height="140" fill="#fff3e0" stroke="#ffb74d" stroke-width="2" rx="10" ry="10"/>
  <text x="450" y="90" font-family="Arial" font-size="18" text-anchor="middle" fill="#e65100" font-weight="bold">Dual Projection Branches</text>
  
  <!-- Synonym Branch -->
  <rect x="100" y="110" width="340" height="80" fill="#ffe0b2" stroke="#ff9800" stroke-width="2" rx="5" ry="5"/>
  <text x="270" y="130" font-family="Arial" font-size="16" text-anchor="middle" fill="#e65100" font-weight="bold">Synonym Projection</text>
  <text x="270" y="155" font-family="Arial" font-size="12" text-anchor="middle">Linear(768 → 256) → ReLU → Dropout</text>
  <text x="270" y="180" font-family="Arial" font-size="12" text-anchor="middle">self.syn_proj(x)</text>
  
  <!-- Antonym Branch -->
  <rect x="460" y="110" width="340" height="80" fill="#ffe0b2" stroke="#ff9800" stroke-width="2" rx="5" ry="5"/>
  <text x="630" y="130" font-family="Arial" font-size="16" text-anchor="middle" fill="#e65100" font-weight="bold">Antonym Projection</text>
  <text x="630" y="155" font-family="Arial" font-size="12" text-anchor="middle">Linear(768 → 256) → ReLU → Dropout</text>
  <text x="630" y="180" font-family="Arial" font-size="12" text-anchor="middle">self.ant_proj(x)</text>
  
  <!-- Fusion Layer -->
  <rect x="50" y="220" width="800" height="80" fill="#e8f5e9" stroke="#81c784" stroke-width="2" rx="10" ry="10"/>
  <text x="450" y="240" font-family="Arial" font-size="18" text-anchor="middle" fill="#2e7d32" font-weight="bold">Feature Fusion</text>
  
  <rect x="200" y="250" width="500" height="40" fill="#c8e6c9" stroke="#4caf50" stroke-width="2" rx="5" ry="5"/>
  <text x="450" y="275" font-family="Arial" font-size="14" text-anchor="middle">Linear(512 → 512) [Combines both projections]</text>
  
  <!-- Graph Transformer Section -->
  <rect x="50" y="310" width="800" height="120" fill="#e1f5fe" stroke="#81d4fa" stroke-width="2" rx="10" ry="10"/>
  <text x="450" y="330" font-family="Arial" font-size="18" text-anchor="middle" fill="#01579b" font-weight="bold">Graph Transformer Layers</text>
  
  <!-- First Transformer Layer -->
  <rect x="100" y="350" width="340" height="60" fill="#b3e5fc" stroke="#039be5" stroke-width="2" rx="5" ry="5"/>
  <text x="270" y="370" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">TransformerConv Layer 1</text>
  <text x="270" y="390" font-family="Arial" font-size="12" text-anchor="middle">512 → 256, heads=2, with dropout</text>
  
  <!-- Second Transformer Layer -->
  <rect x="460" y="350" width="340" height="60" fill="#b3e5fc" stroke="#039be5" stroke-width="2" rx="5" ry="5"/>
  <text x="630" y="370" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">TransformerConv Layer 2</text>
  <text x="630" y="390" font-family="Arial" font-size="12" text-anchor="middle">512 → 256, heads=1, with dropout</text>
  
  <!-- Pooling and Classification Section -->
  <rect x="50" y="440" width="800" height="80" fill="#f3e5f5" stroke="#ce93d8" stroke-width="2" rx="10" ry="10"/>
  <text x="450" y="460" font-family="Arial" font-size="18" text-anchor="middle" fill="#6a1b9a" font-weight="bold">Pooling and Classification</text>
  
  <rect x="200" y="470" width="500" height="40" fill="#e1bee7" stroke="#ba68c8" stroke-width="2" rx="5" ry="5"/>
  <text x="450" y="495" font-family="Arial" font-size="14" text-anchor="middle">Global Mean Pooling → Linear(256 → 2) → Softmax</text>
  
</svg>